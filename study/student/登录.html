<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园管理系统 - 登录</title>
    <!-- 登录页样式（原内联 <style> 已抽出为独立文件） -->
    <link rel="stylesheet" href="./css/login.css">
    <!-- 公共组件样式 -->
    <link rel="stylesheet" href="./css/components.css">
</head>
<body>

<div class="container">
    <!-- 选项卡头部 -->
    <div class="tabs-header">
        <div class="tab-item active" id="studentTab" onclick="switchTab('student')">
            学生登录
        </div>
        <div class="tab-item" id="adminTab" onclick="switchTab('admin')">
            管理员登录
        </div>
    </div>

    <!-- 表单区域 -->
    <div class="form-section">
        <!-- 学生登录表单 -->
        <div class="login-box student-tab" id="studentForm">
            <div class="left-panel">
                <div class="logo-area">
                    <div class="icon">👨‍🎓</div>
                    <h2>校园管理系统</h2>
                    <p>学生端</p>
                </div>
                <ul class="features">
                    <li><i>📚</i> 座位预约</li>
                    <li><i>✅</i> 签到打卡</li>
                    <li><i>📊</i> 学分查询</li>
                    <li><i>🔔</i> 消息通知</li>
                </ul>
            </div>
            <div class="right-panel">
                <div class="form-header">
                    <h3>欢迎回来</h3>
                    <p>请输入您的学号和密码</p>
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="studentUsername" placeholder="请输入学号">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="studentPassword" placeholder="请输入密码">
                </div>
                <div class="remember">
                    <div class="remember-left">
                        <input type="checkbox" id="studentRemember">
                        <label for="studentRemember">记住我</label>
                    </div>
                    <a href="#" class="forgot">忘记密码？</a>
                </div>
                <button class="btn btn-primary" onclick="studentLogin()">登 录</button>
                <button class="btn btn-secondary" onclick="openRegisterModal()">注 册</button>
                <div class="footer-links">
                    <a href="#">服务条款</a>
                    <span>|</span>
                    <a href="#">隐私政策</a>
                </div>
            </div>
        </div>

        <!-- 管理员登录表单 -->
        <div class="login-box admin-tab" id="adminForm" style="display: none;">
            <div class="left-panel">
                <div class="logo-area">
                    <div class="icon">🔐</div>
                    <h2>校园管理系统</h2>
                    <p>管理后台</p>
                </div>
                <ul class="features">
                    <li><i>👥</i> 用户管理</li>
                    <li><i>📈</i> 数据统计</li>
                    <li><i>📝</i> 公告管理</li>
                    <li><i>⚡</i> 违规处理</li>
                </ul>
            </div>
            <div class="right-panel">
                <div class="form-header">
                    <h3>管理员登录</h3>
                    <p>请输入您的管理员账号和密码</p>
                </div>
                <div class="form-group">
                    <label>管理员账号</label>
                    <input type="text" id="adminUsername" placeholder="请输入管理员账号">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="adminPassword" placeholder="请输入密码">
                </div>
                <div class="remember">
                    <div class="remember-left">
                        <input type="checkbox" id="adminRemember">
                        <label for="adminRemember">记住我</label>
                    </div>
                    <a href="#" class="forgot">忘记密码？</a>
                </div>
                <button class="btn btn-primary" onclick="adminLogin()">登 录</button>
                <div class="footer-links">
                    <a href="#">服务条款</a>
                    <span>|</span>
                    <a href="#">隐私政策</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 注册模态框（公共组件：components/app-modal.js）
     box-class="modal" 对应登录页原有的内容盒样式 -->
<app-modal id="registerModal" box-class="modal" close-on-overlay>
    <div class="modal-header">
        <h3>学生注册</h3>
        <span class="modal-close" onclick="closeRegisterModal()">×</span>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label>学号</label>
            <input type="text" id="regStudentId" placeholder="请输入学号">
        </div>
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="regName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeRegisterModal()">取消</button>
        <button class="btn btn-primary" onclick="registerStudent()">注册</button>
    </div>
</app-modal>

<!-- ===== 公共组件与工具 ===== -->
<script src="./js/utils/storage.js"></script>
<script src="./js/components/app-topbar.js"></script>
<script src="./js/components/app-toast.js"></script>
<script src="./js/components/app-modal.js"></script>
<!-- ===== 页面逻辑 ===== -->
<script src="./js/pages/login.js"></script>
</body>
</html>
